[metadata]
name             = bachelor-thesis
version          = 0.1.0
description      = Multimodal Biomedical Signal Classification: Hybrid CNN-LSTM
                   with Adaptive Normalisation and Explainable AI
long_description = file: README.md
long_description_content_type = text/markdown
author           = Author Name
python_requires  = >=3.9

[options]
package_dir =
    = src
packages = find:

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    thesis-run = main:main
