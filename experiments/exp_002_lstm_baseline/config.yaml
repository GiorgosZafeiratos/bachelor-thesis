experiment_name: exp_002_lstm_baseline
model:
  type: lstm_baseline
  input_channels: 1
  hidden_size: 128
  num_layers: 2
  num_classes: 5
  dropout: 0.3
  bidirectional: true
training:
  batch_size: 64
  epochs: 50
  lr: 0.001
  weight_decay: 1e-5
dataset:
  name: mitbih
  path: data/mitbih
preprocessing:
  bandpass: [0.5,100]
  window_size: 512
  overlap: 0.5
