experiment_name: exp_001_cnn_baseline
model:
  type: cnn_baseline
  input_channels: 1
  num_classes: 5
  conv_filters: [64,128,256]
  kernel_size: 3
  dropout: 0.3
training:
  batch_size: 64
  epochs: 50
  lr: 0.001
  weight_decay: 1e-5
dataset:
  name: mitbih
  path: data/mitbih
preprocessing:
  bandpass: [0.5,100]
  window_size: 512
  overlap: 0.5
