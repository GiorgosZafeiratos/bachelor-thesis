model:
  name: HybridCNNLSTM
  input_channels:
    EEG: 32
    ECG: 1
    PPG: 8
  cnn:
    conv_blocks: 3
    kernel_size: 3
    filters: [64, 128, 256]
    stride: 1
    padding: 1
    pooling: max
    pool_size: 2
    activation: relu
    adaptive_norm: true
  lstm:
    layers: 2
    hidden_size: 128
    dropout: 0.3
    bidirectional: false
  attention:
    type: self_attention
    hidden_size: 128
  classifier:
    fc_layers: [256, 128]
    dropout: 0.3
    output_activation: softmax
  explainability:
    method: LRP
    lrp_rules: alpha_beta
    alpha: 1
    beta: 0
